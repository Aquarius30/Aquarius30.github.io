<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hey There Natanem</title>
    <style>
                @media (max-width: 600px) {
                    .container {
                        padding: 24px 8px;
                        max-width: 98vw;
                    }
                    h1 {
                        font-size: 1.5rem;
                    }
                    p {
                        font-size: 1rem;
                    }
                    .start-btn {
                        padding: 12px 10vw;
                        font-size: 1rem;
                    }
                }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #dc143c 60%, #ffb6c1 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: #fff0f6;
            border-radius: 20px;
            box-shadow: 0 6px 24px rgba(220,20,60,0.10);
            padding: 48px 36px;
            max-width: 440px;
            text-align: center;
            border: 2px solid #dc143c33;
        }
        h1 {
            color: #dc143c;
            margin-bottom: 28px;
            font-size: 2.4rem;
            letter-spacing: 1px;
        }
        p {
            color: #8b0000;
            margin-bottom: 36px;
            font-size: 1.25rem;
        }
        .start-btn {
            background: #dc143c;
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 18px 36px;
            font-size: 1.15rem;
            cursor: pointer;
            box-shadow: 0 2px 8px #dc143c33;
            transition: background 0.2s, transform 0.2s, color 0.2s, box-shadow 0.2s;
        }
        .start-btn:hover, .start-btn:focus {
            background: #fff0f6;
            color: #dc143c;
            box-shadow: 0 4px 16px #ffb6c1;
            transform: scale(1.08) rotate(-2deg);
        }
        .container:hover {
            box-shadow: 0 8px 32px #dc143c55;
            border-color: #dc143c;
        }
        h1:hover {
            color: #ff69b4;
            text-shadow: 0 2px 12px #dc143c55;
            cursor: pointer;
        }
        p:hover {
            color: #b22234;
            background: #ffb6c1;
            border-radius: 8px;
            transition: background 0.2s, color 0.2s;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hey there À Moi</h1>
        <p>From one Superman to another Batman<br>Answer choose the right answer if you can...</p>
        <button class="start-btn" onclick="location.href='question.html'">Click here if you want to proceed :)</button>
    </div>
</body>
</html>
